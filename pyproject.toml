[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultknox"
version = "0.7.1"
description = "Encrypted secrets vault + autonomous key-file-backed credentials for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Ufonik" },
]
keywords = ["vault", "secrets", "hermes", "security", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "argon2-cffi>=23.1.0",
  "click>=8.1.0",
  "cryptography>=42.0.0",
  "httpx>=0.27.0",
  "mcp>=1.1.0",
  "pyyaml>=6.0",
  "requests>=2.25.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.6.9",
  "hypothesis>=6.100",
]

[project.urls]
Homepage = "https://github.com/Ufonik88/Hermes-VaultKnox"
Repository = "https://github.com/Ufonik88/Hermes-VaultKnox"
Issues = "https://github.com/Ufonik88/Hermes-VaultKnox/issues"

[project.scripts]
hermes-vault = "vaultknox.cli:main"
hermes-secrets = "vaultknox.autonomous_secrets:cli_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vaultknox = ["assets/*.svg", "assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
