[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultknox"
version = "0.1.0"
description = "Encrypted secrets vault for Hermes Agent"
readme = "hermes-vaultknox-plan.md"
requires-python = ">=3.11"
dependencies = [
  "argon2-cffi>=23.1.0",
  "click>=8.1.0",
  "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[project.scripts]
hermes-vault = "vaultknox.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]