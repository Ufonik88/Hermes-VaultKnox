name: Release

on:
  push:
    tags:
      - 'v*'

# Least privilege by default; only the publish job escalates (OIDC for PyPI).
permissions:
  contents: read

jobs:
  version-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Tag, package and plugin versions must agree
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import sys
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          if not tag.startswith("v"):
              sys.exit(f"tag {tag!r} does not start with 'v'")
          expected = tag[1:]

          package = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          init_src = pathlib.Path("src/vaultknox/__init__.py").read_text()
          dunder = re.search(r'__version__\s*=\s*"([^"]+)"', init_src)
          plugin_src = pathlib.Path("src/vaultknox/_hermes_plugin/plugin.yaml").read_text()
          plugin = re.search(r'^version:\s*(\S+)\s*$', plugin_src, re.MULTILINE)

          if not dunder or not plugin:
              sys.exit("could not read __version__ or plugin.yaml version")

          found = {
              "tag": expected,
              "pyproject.toml": package,
              "src/vaultknox/__init__.py": dunder.group(1),
              "_hermes_plugin/plugin.yaml": plugin.group(1),
          }
          for where, value in found.items():
              print(f"{where}: {value}")
          if len(set(found.values())) != 1:
              sys.exit(f"version mismatch before publish: {found}")
          print(f"OK: all versions agree on {expected}")
          PY

  test:
    needs: version-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Ruff
        run: ruff check src tests

      - name: Run tests
        run: PYTHONPATH=src pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.6.1 twine==7.0.0

      - name: Build sdist and wheel
        run: python -m build

      - name: Twine check
        run: twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install the freshly built wheel into a clean venv
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --upgrade pip
          /tmp/smoke-venv/bin/pip install dist/*.whl

      - name: CLI entry point responds
        run: /tmp/smoke-venv/bin/hermes-vault --version

      - name: Plugin manifest loads from the installed wheel
        run: |
          /tmp/smoke-venv/bin/python - <<'PY'
          import pathlib
          import vaultknox
          import yaml
          manifest = pathlib.Path(vaultknox.__file__).parent / "_hermes_plugin" / "plugin.yaml"
          data = yaml.safe_load(manifest.read_text())
          assert isinstance(data, dict) and data, f"plugin manifest missing or unparseable: {manifest}"
          print(f"OK: {manifest} ({len(data)} top-level keys)")
          PY

  publish:
    needs: [version-check, test, build, smoke]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI via Trusted Publishing (OIDC, no stored token)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # A retried or concurrent run must not fail on a file PyPI already accepted.
          skip-existing: true
